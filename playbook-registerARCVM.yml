  tasks:
    - name: Verify Azure credentials are available
      ansible.builtin.assert:
        that:
          - subscription_id | length > 0
          - tenant_id | length > 0
          - service_principal_id | length > 0
          - service_principal_secret | length > 0
        fail_msg: "Azure credentials not properly injected. Ensure the Azure credential is attached to the job template."
        success_msg: "Azure credentials verified successfully"
      no_log: true

    # ------------------------------------------------------------------
    # Trust the TLS-inspection chain
    # ------------------------------------------------------------------
    - name: Ensure ca-certificates and openssl are present
      ansible.builtin.apt:
        name:
          - ca-certificates
          - openssl
        state: present

    - name: Install Sea-Invest Root CA (fingerprint-validated)
      ansible.builtin.copy:
        content: "{{ internal_root_ca_pem }}"
        dest: "{{ ca_trust_dir }}/{{ internal_root_ca_file }}"
        owner: root
        group: root
        mode: "0644"
        # Runs against the temp copy; file is only put in place if the fingerprint matches
        validate: >-
          sh -c '[ "$(openssl x509 -in %s -noout -fingerprint -sha256 | cut -d= -f2)"
          = "{{ internal_root_ca_sha256 }}" ]'
      register: root_ca_copy

    - name: Install Sea-Invest Issuing CA01 (must chain to the root)
      ansible.builtin.copy:
        content: "{{ internal_issuing_ca_pem }}"
        dest: "{{ ca_trust_dir }}/{{ internal_issuing_ca_file }}"
        owner: root
        group: root
        mode: "0644"
        validate: "openssl verify -CAfile {{ ca_trust_dir }}/{{ internal_root_ca_file }} %s"
      register: issuing_ca_copy

    - name: Rebuild system trust store
      ansible.builtin.command: update-ca-certificates
      when: root_ca_copy is changed or issuing_ca_copy is changed
      changed_when: true

    # ------------------------------------------------------------------
    # Install the Connected Machine agent
    # ------------------------------------------------------------------
    - name: Check whether azcmagent is already installed
      ansible.builtin.stat:
        path: "{{ azcmagent_bin }}"
      register: azcmagent_stat

    - name: Download and install Azure Connected Machine agent
      when: not azcmagent_stat.stat.exists
      block:
        - name: Download Azure Connected Machine agent installer
          ansible.builtin.get_url:
            url: "{{ arc_installer_url }}"
            dest: "{{ arc_installer_path }}"
            mode: "0755"
            timeout: 30
          register: download_result
          retries: 3
          delay: 10
          until: download_result is succeeded

        - name: Install Azure Connected Machine agent
          ansible.builtin.command: "bash {{ arc_installer_path }}"
          args:
            creates: "{{ azcmagent_bin }}"

      rescue:
        - name: Report download failure to Azure
          ansible.builtin.uri:
            url: "https://gbl.his.arc.azure.com/log"
            method: PUT
            body_format: json
            body:
              subscriptionId: "{{ subscription_id }}"
              resourceGroup: "{{ resource_group }}"
              tenantId: "{{ tenant_id }}"
              location: "{{ location }}"
              correlationId: "{{ correlation_id }}"
              authType: "principal"
              operation: "onboarding"
              messageType: "DownloadScriptFailed"
              message: "{{ download_result.msg | default('Download failed') }}"
            status_code: [200, 201, 204]
          when: download_result is defined and download_result is failed
          failed_when: false
          no_log: true

        - name: Fail with the underlying error
          ansible.builtin.fail:
            msg:
              - "Azure Arc agent download/install failed on {{ inventory_hostname }}"
              - "task: {{ ansible_failed_task.name | default('?') }}"
              - "rc: {{ ansible_failed_result.rc | default('n/a') }}"
              - "msg: {{ ansible_failed_result.msg | default('') }}"
              - "stderr (tail): {{ (ansible_failed_result.stderr_lines | default([]))[-25:] }}"
              - "stdout (tail): {{ (ansible_failed_result.stdout_lines | default([]))[-25:] }}"

      always:
        - name: Clean up installation script
          ansible.builtin.file:
            path: "{{ arc_installer_path }}"
            state: absent

    # ------------------------------------------------------------------
    # Connect to Azure Arc
    # ------------------------------------------------------------------
    - name: Check if machine is already connected to Azure Arc
      ansible.builtin.command: azcmagent show -j
      register: azcmagent_status
      failed_when: false
      changed_when: false

    - name: Parse connection status
      ansible.builtin.set_fact:
        # Match the quoted value so "Disconnected" never counts as connected
        is_connected: "{{ azcmagent_status.rc == 0 and '\"Connected\"' in azcmagent_status.stdout }}"

    - name: Display current connection status
      ansible.builtin.debug:
        msg: "Machine {{ inventory_hostname }} is {{ 'already connected' if is_connected else 'not connected' }} to Azure Arc"

    - name: Connect machine to Azure Arc using Service Principal
      ansible.builtin.command: >
        azcmagent connect
        --service-principal-id "{{ service_principal_id }}"
        --service-principal-secret "{{ service_principal_secret }}"
        --resource-group "{{ resource_group }}"
        --tenant-id "{{ tenant_id }}"
        --location "{{ location }}"
        --subscription-id "{{ subscription_id }}"
        --cloud "{{ cloud }}"
        --correlation-id "{{ correlation_id }}"
      when: not is_connected
      register: connect_result
      no_log: true          # hides the secret on the command line
      failed_when: false    # evaluated below so the error is actually visible

    - name: Fail if connect was unsuccessful
      ansible.builtin.fail:
        msg: "azcmagent connect failed (rc={{ connect_result.rc }}): {{ connect_result.stderr | default('') | regex_replace(service_principal_secret, '********') }}"
      when:
        - connect_result is not skipped
        - connect_result.rc != 0
        - "'already connected' not in (connect_result.stderr | default('') | lower)"

    - name: Verify connection after registration
      ansible.builtin.command: azcmagent show -j
      register: verify_status
      when: connect_result is not skipped
      changed_when: false

    - name: Display final connection status
      ansible.builtin.debug:
        msg: |
          Azure Arc Registration Summary for {{ inventory_hostname }}:
          - Status: {{ 'Connected' if (is_connected or (verify_status.stdout | default('') is search('"Connected"'))) else 'NOT connected' }}
          - Resource Group: {{ resource_group }}
          - Location: {{ location }}
          - Subscription: {{ subscription_id }}
