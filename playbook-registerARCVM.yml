---
# Register Debian VMs to Azure Arc
#
# Traffic to *.his.arc.azure.com is decrypted by the Palo Alto SSL forward proxy
# (SI-PA-Forward-Trust -> Sea-Invest Issuing CA01 -> Sea-Invest Root CA), so the
# internal CA chain must be trusted on the host before anything talks to Azure.
#
# The CA certificates are embedded below (internal_root_ca_pem /
# internal_issuing_ca_pem) - no extra files needed in the project.

- name: Register Debian VMs to Azure Arc
  hosts: all
  become: true

  vars:
    subscription_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}"
    tenant_id: "{{ lookup('env', 'AZURE_TENANT') }}"
    service_principal_id: "{{ lookup('env', 'AZURE_CLIENT_ID') }}"
    service_principal_secret: "{{ lookup('env', 'AZURE_SECRET') }}"

    resource_group: "weu-p1-arc-silver-01"
    location: "westeurope"
    cloud: "AzureCloud"
    correlation_id: "3ade8cb6-9c79-4aba-97f9-17e66f16b957"

    arc_installer_url: "https://gbl.his.arc.azure.com/azcmagent-linux"
    arc_installer_path: "/tmp/install_linux_azcmagent.sh"
    azcmagent_bin: "/opt/azcmagent/bin/azcmagent"

    # Internal PKI used by the Palo Alto forward proxy
    ca_trust_dir: "/usr/local/share/ca-certificates"
    internal_root_ca_file: "SeaInvest-Root-CA.crt"
    internal_issuing_ca_file: "SeaInvest-Issuing-CA01.crt"
    # Pinned so a wrong or tampered root can never land in the trust store
    internal_root_ca_sha256: "02:BB:64:29:D8:5E:4A:78:A5:81:F2:C8:21:F3:99:D2:51:FE:2D:C4:4C:23:C1:A5:03:1E:37:2C:C2:FE:76:C4"

