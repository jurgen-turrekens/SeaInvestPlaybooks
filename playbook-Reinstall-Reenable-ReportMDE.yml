---
- name: MDE Remediation and Status Report
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Upgrade mdatp to latest available build
      ansible.builtin.apt:
        name: mdatp
        state: latest
        update_cache: true
      register: mdatp_upgrade

    - name: Ensure mdatp service is enabled and started
      ansible.builtin.systemd:
        name: mdatp
        enabled: true
        state: started

    # The agent needs a few seconds after (re)start to complete its
    # cloud/license check - querying mdatp too early can transiently
    # report "Cannot determine license status" even on a healthy host.
    - name: Give the agent a moment to complete its license/cloud check
      ansible.builtin.pause:
        seconds: 15

    - name: Check mdatp service status
      ansible.builtin.systemd:
        name: mdatp
      register: mdatp_service
      failed_when: false
      changed_when: false

    - name: Set mdatp running fact
      ansible.builtin.set_fact:
        mdatp_running: "{{ mdatp_service.status.ActiveState | default('unknown') == 'active' }}"

    - name: Get platform version
      ansible.builtin.command: mdatp health --field app_version
      register: platform_version
      changed_when: false
      failed_when: false
      when: mdatp_running

    - name: Get definitions version
      ansible.builtin.command: mdatp health --field definitions_version
      register: definitions_version
      changed_when: false
      failed_when: false
      when: mdatp_running

    - name: Get definitions status
      ansible.builtin.command: mdatp health --field definitions_status
      register: definitions_status
      changed_when: false
      failed_when: false
      when: mdatp_running

    - name: Get licensed field
      ansible.builtin.command: mdatp health --field licensed
      register: licensed_field
      changed_when: false
      failed_when: false
      when: mdatp_running

    # Resolve every value through default() up front, and strip the
    # surrounding quotes `mdatp health --field` puts around string
    # values, so the summary play can print hostvars as-is.
    #
    # A host whose license has failed prints its "ATTENTION: No
    # license found..." warning to stdout ahead of the actual value,
    # on every field query - so its raw stdout is multi-line garbage
    # rather than a clean value. Detect that case up front and flag
    # the host instead of feeding the garbled text into the report.
    - name: Detect license/health errors in raw output
      ansible.builtin.set_fact:
        mdatp_health_error: >-
          {{
            mdatp_running and
            (
              (platform_version.stdout | default(''))
              ~ (definitions_version.stdout | default(''))
              ~ (definitions_status.stdout | default(''))
              ~ (licensed_field.stdout | default(''))
            ) is search('ATTENTION')
          }}

    - name: Set display facts
      ansible.builtin.set_fact:
        platform_display: "{{ 'N/A' if mdatp_health_error else (platform_version.stdout | default('N/A') | regex_replace('\"', '')) }}"
        definitions_display: "{{ 'N/A' if mdatp_health_error else (definitions_version.stdout | default('N/A') | regex_replace('\"', '')) }}"
        definitions_status_display: "{{ 'N/A' if mdatp_health_error else (definitions_status.stdout | default('N/A') | regex_replace('\"', '')) }}"
        licensed_display: "{{ 'N/A' if mdatp_health_error else (licensed_field.stdout | default('N/A') | regex_replace('\"', '')) }}"


- name: MDE Status Summary
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # One short block per host instead of a wide fixed-column table -
    # a wide table wraps unpredictably in narrow consoles (AWX job
    # output, mobile, etc.); short blocks stay readable regardless of
    # width. Problem hosts are listed first so they're not buried.
    #
    # Every hostvars lookup goes through default() - a host that
    # failed before mdatp_running was even set (e.g. the upgrade task
    # itself failed) still needs to show up as a problem host rather
    # than crashing the whole report.
    - name: Build summary blocks
      ansible.builtin.set_fact:
        not_running_block: |-
          {% for h in groups['all'] | sort %}
          {%- if not (hostvars[h].mdatp_running | default(false)) %}
          - {{ h }}
          {% endif -%}
          {% endfor %}
        license_error_block: |-
          {% for h in groups['all'] | sort %}
          {%- if hostvars[h].mdatp_health_error | default(false) %}
          - {{ h }} (service running, license/health check failed)
          {% endif -%}
          {% endfor %}
        running_block: |-
          {% for h in groups['all'] | sort %}
          {%- if (hostvars[h].mdatp_running | default(false)) and not (hostvars[h].mdatp_health_error | default(false)) %}
          {{ h }}
              Platform    : {{ hostvars[h].platform_display | default('N/A') }}
              Definitions : {{ hostvars[h].definitions_display | default('N/A') }} ({{ hostvars[h].definitions_status_display | default('N/A') }})
              Licensed    : {{ hostvars[h].licensed_display | default('N/A') }}

          {% endif -%}
          {% endfor %}

    - name: Print MDE status summary
      ansible.builtin.debug:
        msg: >-
          {{
            (
              [
                (running_block.splitlines() | select('match', '^[^ ]') | reject('equalto', '') | list | length | string)
                ~ ' / ' ~ (groups['all'] | length | string) ~ ' hosts healthy and RUNNING',
                ''
              ]
              +
              (
                ['NOT RUNNING:'] + (not_running_block.splitlines() | map('trim') | reject('equalto', '') | list) + ['']
                if (not_running_block | trim | length > 0)
                else []
              )
              +
              (
                ['LICENSE / HEALTH ERROR:'] + (license_error_block.splitlines() | map('trim') | reject('equalto', '') | list) + ['']
                if (license_error_block | trim | length > 0)
                else []
              )
              + ['RUNNING:']
              + (running_block.splitlines() | reject('equalto', '') | list)
            )
          }}
