---
# PHP2Shell + follow-up PHP advisories - READ-ONLY exposure check
#
# Advisories checked (edit php_advisories to add more):
#   php2shell        CVE-2026-109618, CVE-2026-109619   fixed 21 Oct 2026 (8.5.12 / 8.4.27 / 8.3.36 / 8.2.35)
#   php2shell-3      CVE-2026-115560 (session upload-progress serializer mismatch, "third PHP2Shell bug")
#                                                        fixed 19 Nov 2026 (8.5.13 / 8.4.28 / 8.3.37 / 8.2.36)
#   fpm-smuggling    CVE-2026-129289 (PHP-FPM request smuggling, CVSS 9.2) - same 19 Nov release
#
# Per PHP install and per advisory:
#   PATCHED     - one of the advisory's CVE ids is in the package changelog (distro backport),
#                 or upstream version >= fixed version for that branch
#   VULNERABLE  - anything else (EOL branches < 8.2 get no upstream fix: distro backport only)
#
# Per host it also reports (read-only):
#   RESTART_NEEDED  running php-fpm / apache mod_php still maps a replaced (deleted) PHP binary
#   exposure flags  session.upload_progress.enabled (FPM/apache SAPI ini + FPM pools),
#                   fastcgi_keep_conn / enablereuse (CVE-2026-129289 precondition),
#                   catch_workers_output = yes (CVE-2026-129291 precondition)
#
# Host STATUS: VULNERABLE > RESTART_NEEDED > PATCHED > NOT_INSTALLED
# Makes no changes to the hosts.
#
# Usage:
#   ansible-playbook php2shell_check.yml -e target_hosts=linux
#   AWX: set target_hosts as extra var; fleet summary published via set_stats (php2shell_fleet).

- name: PHP advisory exposure check
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: false
  vars:
    php_advisories:
      - id: php2shell
        cves: [CVE-2026-109618, CVE-2026-109619]
        fixed: {"8.5": "8.5.12", "8.4": "8.4.27", "8.3": "8.3.36", "8.2": "8.2.35"}
      - id: php2shell-3
        cves: [CVE-2026-115560]
        fixed: {"8.5": "8.5.13", "8.4": "8.4.28", "8.3": "8.3.37", "8.2": "8.2.36"}
      - id: fpm-smuggling
        cves: [CVE-2026-129289]
        fixed: {"8.5": "8.5.13", "8.4": "8.4.28", "8.3": "8.3.37", "8.2": "8.2.36"}
    php2shell_python: "{{ ansible_python_interpreter | default(discovered_interpreter_python) | default('/usr/bin/python3') }}"

  tasks:
    - name: Remember target host list for the summary play
      ansible.builtin.set_fact:
        php2shell_targets: "{{ ansible_play_hosts_all }}"
      run_once: true
      delegate_to: localhost
      delegate_facts: true

    - name: Inventory PHP installs and evaluate advisories
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          {{ php2shell_python }} - <<'PYEOF'
          {% raw %}
          import glob, gzip, json, os, re, shutil, subprocess

          ADV = json.loads(os.environ.get('PHP_ADVISORIES') or '[]')
          ALL_CVES = sorted({c for a in ADV for c in a['cves']})

          def run(cmd, timeout=20):
              try:
                  return subprocess.check_output(
                      cmd, stderr=subprocess.DEVNULL, universal_newlines=True,
                      timeout=timeout, env=dict(os.environ, LC_ALL='C')).strip()
              except Exception:
                  return None

          def read(path, limit=None):
              try:
                  opener = gzip.open if path.endswith('.gz') else open
                  with opener(path, 'rt', errors='ignore') as f:
                      return f.read(limit) if limit else f.read()
              except Exception:
                  return ''

          def vt(v):
              return tuple(int(x) for x in re.findall(r'\d+', v or '')[:3])

          def branch_of(v):
              m = re.match(r'(\d+)\.(\d+)', v or '')
              return '{}.{}'.format(*m.groups()) if m else None

          def judge(branch, upstream, changelog):
              """Return {advisory_id: (status, reason)}."""
              res = {}
              for a in ADV:
                  hit = [c for c in a['cves'] if c in changelog]
                  fx = a['fixed'].get(branch)
                  if hit:
                      res[a['id']] = ('PATCHED', 'changelog: ' + ','.join(hit))
                  elif fx and upstream and vt(upstream) >= vt(fx):
                      res[a['id']] = ('PATCHED', '{} >= {}'.format(upstream, fx))
                  elif branch and vt(branch) < (8, 2):
                      res[a['id']] = ('VULNERABLE', 'EOL {}: distro backport only'.format(branch))
                  elif not fx:
                      res[a['id']] = ('VULNERABLE', 'no fixed version known for {}'.format(branch))
                  else:
                      res[a['id']] = ('VULNERABLE', '{} < {}, CVE not in changelog'.format(upstream, fx))
              return res

          installs = []

          # --- Debian / Ubuntu (distro + sury.org) ---------------------------------
          if shutil.which('dpkg-query'):
              out = run(['dpkg-query', '-W', '-f=${Package}\t${Version}\t${db:Status-Abbrev}\n']) or ''
              for line in out.splitlines():
                  parts = line.split('\t')
                  if len(parts) != 3 or not parts[2].startswith('ii'):
                      continue
                  name, ver, _ = parts
                  m = re.match(r'^php(\d+\.\d+)-common$', name)
                  if not m:
                      continue
                  branch = m.group(1)
                  up = re.match(r'^(?:\d+:)?(\d+\.\d+\.\d+)', ver)
                  up = up.group(1) if up else ver
                  cl = ''
                  for f in sorted(glob.glob('/usr/share/doc/php{}-*/changelog.Debian*'.format(branch))):
                      cl += read(f)
                      if all(c in cl for c in ALL_CVES):
                          break
                  installs.append(dict(source='dpkg', name=name, version=ver, branch=branch,
                                       advisories=judge(branch, up, cl)))

          # --- RHEL family (AppStream, Remi, SCL, cPanel ea-php) --------------------
          if shutil.which('rpm'):
              out = run(['rpm', '-qa', '--qf', '%{NAME}\t%{VERSION}\t%{RELEASE}\n']) or ''
              for line in out.splitlines():
                  parts = line.split('\t')
                  if len(parts) != 3:
                      continue
                  name, ver, rel = parts
                  if not re.match(r'^(php\d*|php\d+-php|ea-php\d+-php|rh-php\d+-php)-common$', name):
                      continue
                  branch = branch_of(ver)
                  cl = run(['rpm', '-q', '--changelog', name]) or ''
                  installs.append(dict(source='rpm', name=name, version='{}-{}'.format(ver, rel),
                                       branch=branch, advisories=judge(branch, ver, cl)))

          # --- PHP binaries not owned by any package (source builds, vendor bundles) -
          pats = ['/usr/local/bin/php*', '/usr/local/sbin/php-fpm*', '/usr/bin/php*', '/usr/sbin/php-fpm*',
                  '/opt/*/bin/php', '/opt/*/*/bin/php', '/opt/*/*/*/bin/php']
          seen = set()
          for pat in pats:
              for p in glob.glob(pat):
                  if not re.search(r'/php(-fpm|-cgi)?[\d.]*$', p):
                      continue
                  rp = os.path.realpath(p)
                  if rp in seen or not (os.path.isfile(rp) and os.access(rp, os.X_OK)):
                      continue
                  seen.add(rp)
                  owned = False
                  if shutil.which('dpkg') and (run(['dpkg', '-S', rp]) or run(['dpkg', '-S', p])):
                      owned = True
                  if shutil.which('rpm'):
                      q = run(['rpm', '-qf', rp])
                      if q and 'not owned' not in q:
                          owned = True
                  if owned:
                      continue
                  m = re.search(r'PHP (\d+\.\d+\.\d+)', run([rp, '-v'], timeout=10) or '')
                  if not m:
                      continue
                  ver = m.group(1)
                  installs.append(dict(source='unmanaged', name=rp, version=ver, branch=branch_of(ver),
                                       advisories=judge(branch_of(ver), ver, '')))

          # --- Running processes still on a replaced PHP binary ---------------------
          stale = []
          for pid in filter(str.isdigit, os.listdir('/proc')):
              try:
                  comm = read('/proc/{}/comm'.format(pid)).strip()
                  if not re.match(r'^(php-fpm|php-cgi|apache2|httpd)', comm):
                      continue
                  exe = os.readlink('/proc/{}/exe'.format(pid))
                  hits = []
                  if 'php' in exe and exe.endswith(' (deleted)'):
                      hits.append(exe)
                  for ln in read('/proc/{}/maps'.format(pid)).splitlines():
                      if re.search(r'/(libphp[^/ ]*\.so|mod_php[^/ ]*\.so)', ln) and ln.endswith('(deleted)'):
                          hits.append(ln.split(None, 5)[-1])
                  if hits:
                      stale.append('{} pid {}: {}'.format(comm, pid, sorted(set(hits))[0]))
              except Exception:
                  pass
          stale = sorted(set(stale))[:10]

          # --- Exposure flags (config only, informational) --------------------------
          flags = []

          def ini_value(files, key):
              val = None
              for f in files:
                  for ln in read(f).splitlines():
                      m = re.match(r'^\s*' + re.escape(key) + r'\s*=\s*"?([^";\s]+)', ln)
                      if m:
                          val = m.group(1)
              return val

          for sapi_dir in sorted(glob.glob('/etc/php/*/fpm') + glob.glob('/etc/php/*/apache2')):
              files = [sapi_dir + '/php.ini'] + sorted(glob.glob(sapi_dir + '/conf.d/*.ini'))
              v = ini_value(files, 'session.upload_progress.enabled')
              on = v is None or v.lower() in ('1', 'on', 'true', 'yes')
              if on:
                  flags.append('upload_progress ON ({}) in {}'.format('default' if v is None else v, sapi_dir))
          for f in sorted(glob.glob('/etc/php.ini')):
              v = ini_value([f] + sorted(glob.glob('/etc/php.d/*.ini')), 'session.upload_progress.enabled')
              if v is None or v.lower() in ('1', 'on', 'true', 'yes'):
                  flags.append('upload_progress ON ({}) in /etc/php.ini'.format('default' if v is None else v))

          pools = glob.glob('/etc/php/*/fpm/pool.d/*.conf') + glob.glob('/etc/php-fpm.d/*.conf') + \
                  glob.glob('/opt/remi/*/root/etc/php-fpm.d/*.conf') + glob.glob('/etc/opt/remi/*/php-fpm.d/*.conf')
          for f in sorted(pools):
              txt = read(f)
              if re.search(r'^\s*catch_workers_output\s*=\s*yes', txt, re.M | re.I):
                  flags.append('catch_workers_output=yes in {} (CVE-2026-129291)'.format(f))
              if re.search(r'^\s*php_(admin_)?(flag|value)\[session\.upload_progress\.enabled\]\s*=\s*(1|on|true|yes)',
                           txt, re.M | re.I):
                  flags.append('upload_progress forced ON in pool {}'.format(f))

          web = glob.glob('/etc/nginx/**/*.conf', recursive=True) + glob.glob('/etc/nginx/sites-enabled/*') + \
                glob.glob('/etc/apache2/**/*.conf', recursive=True) + glob.glob('/etc/httpd/**/*.conf', recursive=True)
          for f in sorted(set(web)):
              txt = read(f, 2000000)
              if re.search(r'^[^#\n]*\bfastcgi_keep_conn\s+on\b', txt, re.M | re.I):
                  flags.append('fastcgi_keep_conn on in {} (CVE-2026-129289)'.format(f))
              if re.search(r'^[^#\n]*\benablereuse\s*=\s*on\b', txt, re.M | re.I):
                  flags.append('enablereuse=on in {} (CVE-2026-129289)'.format(f))

          # --- Roll-up ----------------------------------------------------------------
          if not installs:
              overall = 'NOT_INSTALLED'
          elif any(s == 'VULNERABLE' for i in installs for s, _ in i['advisories'].values()):
              overall = 'VULNERABLE'
          elif stale:
              overall = 'RESTART_NEEDED'
          else:
              overall = 'PATCHED'

          summary = []
          for i in installs:
              summary.append('{} {}'.format(i['name'], i['version']))
              for aid, (st, why) in i['advisories'].items():
                  summary.append('  {:<10} {:<14} {}'.format(st, aid, why))
          summary += ['RESTART_NEEDED ' + s for s in stale]
          summary += ['EXPOSURE ' + f for f in flags]

          print(json.dumps(dict(status=overall, installs=installs, stale=stale, flags=flags, summary=summary)))
          {% endraw %}
          PYEOF
      environment:
        PHP_ADVISORIES: "{{ php_advisories | to_json }}"
      register: php2shell_raw
      changed_when: false

    - name: Parse result
      ansible.builtin.set_fact:
        php2shell: "{{ php2shell_raw.stdout | from_json }}"

    - name: Host report
      ansible.builtin.debug:
        msg: "{{ ['STATUS: ' ~ php2shell.status] + php2shell.summary }}"

- name: PHP advisory fleet summary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Build summary
      ansible.builtin.set_fact:
        php2shell_fleet: >-
          {%- set out = {} -%}
          {%- for h in hostvars['localhost'].php2shell_targets | default([]) | sort -%}
          {%- set _ = out.update({h: hostvars[h].php2shell.status
                                     if hostvars[h].php2shell is defined
                                     else 'NO_DATA'}) -%}
          {%- endfor -%}
          {{ out }}

    - name: Fleet summary
      ansible.builtin.debug:
        msg: >-
          {%- set lines = [] -%}
          {%- for st in ['VULNERABLE', 'RESTART_NEEDED', 'PATCHED', 'NOT_INSTALLED', 'NO_DATA'] -%}
          {%- set hs = php2shell_fleet | dict2items | selectattr('value', 'eq', st) | map(attribute='key') | list -%}
          {%- set _ = lines.append('%-15s (%d): %s' | format(st, hs | length,
                                   ('' if st == 'NOT_INSTALLED' else hs | join(', ')))) -%}
          {%- endfor -%}
          {{ lines }}

    - name: Publish to AWX job artifacts
      ansible.builtin.set_stats:
        data:
          php2shell_fleet: "{{ php2shell_fleet }}"
        per_host: false
